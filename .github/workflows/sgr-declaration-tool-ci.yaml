name: SGr Declaration Tool CI Build

on:
  workflow_dispatch:
  push:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci

      - name: Test
        run: |
          npm run test

      - name: Build
        run: |
          npm run build
